<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🏛️ Générateur de Civilisation Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="combinations.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        h1, h2, h3 {
            font-family: 'Cinzel', serif;
        }

        .element-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 20px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .element-card:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.1) 100%);
        }

        .element-card.selected {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
            background: linear-gradient(135deg, rgba(255,215,0,0.25) 0%, rgba(255,215,0,0.15) 100%);
        }

        .element-card.new-discovery {
            animation: pulse 1s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,215,0,0.6); }
        }

        .era-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .narration-box {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            border-left: 4px solid #ffd700;
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0;
            font-style: italic;
            animation: slideIn 0.5s ease-out;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .combine-zone {
            background: rgba(255,215,0,0.1);
            border: 3px dashed rgba(255,215,0,0.4);
            border-radius: 20px;
            padding: 24px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .combine-zone.ready {
            border-color: #ffd700;
            background: rgba(255,215,0,0.2);
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
        }

        .stats-panel {
            background: linear-gradient(135deg, rgba(102,126,234,0.2) 0%, rgba(118,75,162,0.2) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 16px;
        }

        .btn-combine {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 32px;
            border-radius: 50px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1rem;
            width: 100%;
            touch-action: manipulation;
        }

        .btn-combine:active {
            transform: scale(0.95);
        }

        .btn-combine:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #ffd700 100%);
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        .element-icon {
            font-size: 3rem;
            margin-bottom: 8px;
            display: block;
        }

        .discovery-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
            padding: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .discovery-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px 20px;
            max-width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            animation: scaleIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .sparkle {
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .era-transition {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: eraFade 3s ease-in-out forwards;
        }

        @keyframes eraFade {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; pointer-events: none; }
        }

        .achievement-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #1a1a2e;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(255,215,0,0.4);
            animation: slideInTop 0.5s ease-out, slideOutTop 0.5s ease-in 2.5s forwards;
            z-index: 3000;
            font-weight: 600;
            max-width: 90%;
            font-size: 0.9rem;
        }

        @keyframes slideInTop {
            from { transform: translateX(-50%) translateY(-100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        @keyframes slideOutTop {
            from { transform: translateX(-50%) translateY(0); opacity: 1; }
            to { transform: translateX(-50%) translateY(-100px); opacity: 0; }
        }

        .mobile-btn {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
            touch-action: manipulation;
        }

        .mobile-btn:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.15);
        }

        .mobile-btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #f8d568 100%);
            color: #1a1a2e;
            border: none;
        }

        .mobile-btn-green {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            color: white;
            border: none;
        }

        .slot {
            width: 90px;
            height: 90px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            border: 2px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="p-3">
    <!-- Header -->
    <div class="max-w-2xl mx-auto mb-4">
        <div class="text-center mb-4">
            <h1 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-purple-400 to-blue-400">
                🏛️ Générateur de Civilisation
            </h1>
            <p class="text-gray-400 text-sm">De l'aube de l'humanité à l'infini</p>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel mb-4">
            <div class="grid grid-cols-3 gap-2 mb-3">
                <div class="text-center">
                    <div class="era-badge inline-block mb-1" id="currentEra">TRIBALE</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-yellow-400" id="elementsCount">2</div>
                    <div class="text-xs text-gray-400 mt-1">Éléments</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-green-400" id="achievementsCount">0</div>
                    <div class="text-xs text-gray-400 mt-1">🏆 Succès</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- Combine Zone -->
    <div class="max-w-2xl mx-auto mb-4">
        <div class="bg-black bg-opacity-30 backdrop-blur-md rounded-2xl p-4 border border-white border-opacity-10">
            <h2 class="text-xl font-bold mb-4 text-center">🔮 Combinaison</h2>

            <div class="combine-zone mb-4" id="combineZone">
                <p class="text-gray-400 mb-4 text-sm text-center">Sélectionne 2 éléments</p>
                <div class="flex justify-center gap-4 items-center">
                    <div id="slot1" class="slot"></div>
                    <div class="text-2xl">+</div>
                    <div id="slot2" class="slot"></div>
                </div>
            </div>

            <button id="combineBtn" class="btn-combine mb-3" disabled>
                Créer !
            </button>

            <div class="grid grid-cols-3 gap-2">
                <button id="resetBtn" class="mobile-btn">Effacer</button>
                <button id="hintBtn" class="mobile-btn mobile-btn-gold">💡 Indice</button>
                <button id="achievementsBtn" class="mobile-btn mobile-btn-green">🏆</button>
            </div>
        </div>
    </div>

    <!-- Elements Grid -->
    <div class="max-w-2xl mx-auto">
        <div class="bg-black bg-opacity-30 backdrop-blur-md rounded-2xl p-4 border border-white border-opacity-10">
            <h2 class="text-xl font-bold mb-4 flex items-center justify-center gap-2">
                <span class="sparkle">✨</span>
                Tes Éléments
                <span class="sparkle">✨</span>
            </h2>
            <div id="elementsGrid" class="grid grid-cols-3 gap-3">
                <!-- Elements will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // Reuse the exact same game logic from desktop version
        const ERAS = {
            1: { name: "TRIBALE", threshold: 50 },
            2: { name: "AGRICOLE", threshold: 120 },
            3: { name: "ANTIQUE", threshold: 250 },
            4: { name: "INDUSTRIELLE", threshold: 400 },
            5: { name: "SPATIALE", threshold: 999 }
        };

        const ACHIEVEMENTS = {
            "first_combination": { name: "✨ Premier Pas", desc: "Réaliser votre première combinaison", check: (state) => state.combinationsCount >= 1 },
            "laborantin": { name: "🧪 Laborantin", desc: "Réaliser 10 combinaisons", check: (state) => state.combinationsCount >= 10 },
            "batisseur": { name: "🛠️ Bâtisseur", desc: "Réaliser 50 combinaisons", check: (state) => state.combinationsCount >= 50 },
            "penseur": { name: "🧠 Penseur", desc: "Réaliser 100 combinaisons", check: (state) => state.combinationsCount >= 100 },
            "architecte": { name: "🏛️ Architecte du Savoir", desc: "Réaliser 250 combinaisons", check: (state) => state.combinationsCount >= 250 },
            "demiurge": { name: "🌌 Démiurge", desc: "Réaliser 500 combinaisons", check: (state) => state.combinationsCount >= 500 },
            "fire_master": { name: "🔥 Âge du Feu", desc: "Maîtriser le Feu", check: (state) => state.elements.find(e => e.name === "Feu" && e.discovered) },
            "language": { name: "🗣️ Don de la Parole", desc: "Développer le Langage", check: (state) => state.elements.find(e => e.name === "Langage" && e.discovered) },
            "agriculture": { name: "🌾 Révolution Néolithique", desc: "Découvrir l'Agriculture", check: (state) => state.elements.find(e => e.name === "Agriculture" && e.discovered) },
            "village": { name: "🏘️ Fondations", desc: "Construire le premier Village", check: (state) => state.elements.find(e => e.name === "Village" && e.discovered) },
            "writing": { name: "✍️ Le Scribe", desc: "Inventer l'Écriture", check: (state) => state.elements.find(e => e.name === "Écriture" && e.discovered) },
            "religion": { name: "🙏 Voix des Dieux", desc: "Former une Religion Organisée", check: (state) => state.elements.find(e => e.name === "Religion" && e.discovered) },
            "metal": { name: "⚔️ Âge du Bronze", desc: "Découvrir le Métal", check: (state) => state.elements.find(e => e.name === "Métal" && e.discovered) },
            "city": { name: "🏛️ Centre du Monde", desc: "Fonder une Cité", check: (state) => state.elements.find(e => e.name === "Cité" && e.discovered) },
            "philosophy": { name: "🧠 L'Esprit S'Éveille", desc: "Développer la Philosophie", check: (state) => state.elements.find(e => e.name === "Philosophie" && e.discovered) },
            "empire": { name: "🌍 Hégémonie", desc: "Former un Empire", check: (state) => state.elements.find(e => e.name === "Empire" && e.discovered) },
            "factory": { name: "⚙️ L'Atelier du Monde", desc: "Construire la première Usine", check: (state) => state.elements.find(e => e.name === "Usine" && e.discovered) },
            "electricity": { name: "💡 Que la Lumière Soit", desc: "Maîtriser l'Électricité", check: (state) => state.elements.find(e => e.name === "Électricité" && e.discovered) },
            "computer": { name: "💻 Enfant Numérique", desc: "Inventer l'Ordinateur", check: (state) => state.elements.find(e => e.name === "Ordinateur" && e.discovered) },
            "ai": { name: "🤖 Je Pense, Donc Je Suis", desc: "Créer une IA", check: (state) => state.elements.find(e => e.name === "Intelligence Artificielle" && e.discovered) },
            "internet": { name: "🌐 Monde Connecté", desc: "Lancer Internet", check: (state) => state.elements.find(e => e.name === "Internet" && e.discovered) },
            "space": { name: "🚀 Vers l'Infini", desc: "Réussir la Conquête Spatiale", check: (state) => state.elements.find(e => e.name === "Fusée" && e.discovered) }
        };
        // COMBINATIONS chargées depuis combinations.js


        // Copy all game logic functions from desktop version...
        // [The rest is identical to index.html, just adapted for mobile display]

        // Game State
        let gameState = {
            currentEra: 1,
            elements: [
                { name: "Peuple", icon: "👤", discovered: true, new: false },
                { name: "Terre", icon: "🏞️", discovered: true, new: false }
            ],
            selectedElements: [],
            combinationsCount: 0,
            history: [],
            achievements: [],
            baseElements: [
                { name: "Eau", icon: "💧" },
                { name: "Pierre", icon: "🗿" },
                { name: "Arbre", icon: "🌳" },
                { name: "Son", icon: "🔊" },
                { name: "Animal", icon: "🦌" },
                { name: "Plante", icon: "🌱" },
                { name: "Ciel", icon: "🌌" },
                { name: "Graine", icon: "🌾" },
                { name: "Laine", icon: "🧶" },
                { name: "Pigment", icon: "🎨" },
                { name: "Peinture", icon: "🎨" },
                { name: "Histoire", icon: "📖" },
                { name: "Raison", icon: "🧠" },
                { name: "Savoir", icon: "🧠" },
                { name: "Science", icon: "🔬" },
                { name: "Charbon", icon: "🪨" },
                { name: "Acier", icon: "⛓️" },
                { name: "Chimie", icon: "⚗️" },
                { name: "Physique", icon: "⚖️" },
                { name: "Machine", icon: "⚙️" },
                { name: "Verre", icon: "🥛" },
                { name: "Microscope", icon: "🔬" },
                { name: "Vie", icon: "🧬" },
                { name: "Énergie", icon: "⚡" },
                { name: "Conquête", icon: "⚔️" },
                { name: "Cerveau", icon: "🧠" },
                { name: "Planète", icon: "🌍" },
                { name: "Soleil", icon: "☀️" },
                { name: "Vent", icon: "🌬️" },
                { name: "Ville", icon: "🏙️" },
                { name: "Croyance", icon: "🌌" },
                { name: "Peur", icon: "😨" },
                { name: "Mort", icon: "💀" },
                { name: "Guerre", icon: "⚔️" },
                { name: "Art", icon: "🎨" },
                { name: "Médecine", icon: "🩺" }
            ]
        };

        // Copy all functions from index.html...
        function ensureElementExists(name) {
            if (!gameState.elements.find(e => e.name === name)) {
                const baseElem = gameState.baseElements.find(e => e.name === name);
                if (baseElem) {
                    gameState.elements.push({
                        name: baseElem.name,
                        icon: baseElem.icon,
                        discovered: true,
                        new: true
                    });
                }
            }
        }

        function init() {
            renderElements();
            updateStats();
        }

        function renderElements() {
            const grid = document.getElementById('elementsGrid');
            grid.innerHTML = '';

            gameState.elements
                .filter(e => e.discovered)
                .sort((a, b) => a.name.localeCompare(b.name))
                .forEach(element => {
                    const card = document.createElement('div');
                    card.className = `element-card ${element.new ? 'new-discovery' : ''} ${gameState.selectedElements.includes(element) ? 'selected' : ''}`;
                    card.innerHTML = `
                        <div class="element-icon">${element.icon}</div>
                        <div class="font-semibold text-center text-xs">${element.name}</div>
                    `;
                    card.onclick = () => selectElement(element);
                    grid.appendChild(card);

                    if (element.new) {
                        setTimeout(() => {
                            element.new = false;
                            card.classList.remove('new-discovery');
                        }, 1000);
                    }
                });
        }

        function selectElement(element) {
            const count = gameState.selectedElements.filter(e => e === element).length;

            if (count === 2) {
                const index = gameState.selectedElements.indexOf(element);
                gameState.selectedElements.splice(index, 1);
            } else if (gameState.selectedElements.length < 2) {
                gameState.selectedElements.push(element);
            } else {
                gameState.selectedElements = [element];
            }

            updateCombineZone();
            renderElements();
        }

        function updateCombineZone() {
            const slot1 = document.getElementById('slot1');
            const slot2 = document.getElementById('slot2');
            const combineBtn = document.getElementById('combineBtn');
            const zone = document.getElementById('combineZone');

            slot1.textContent = gameState.selectedElements[0]?.icon || '';
            slot2.textContent = gameState.selectedElements[1]?.icon || '';

            const canCombine = gameState.selectedElements.length === 2;
            combineBtn.disabled = !canCombine;

            if (canCombine) {
                zone.classList.add('ready');
            } else {
                zone.classList.remove('ready');
            }
        }

        function combineElements() {
            // Disable button temporarily to prevent double-tap
            document.getElementById('combineBtn').disabled = true;

            if (gameState.selectedElements.length !== 2) return;

            const [elem1, elem2] = gameState.selectedElements;
            const key1 = `${elem1.name}+${elem2.name}`;
            const key2 = `${elem2.name}+${elem1.name}`;

            const combination = COMBINATIONS[key1] || COMBINATIONS[key2];

            if (combination) {
                ensureElementExists(elem1.name);
                ensureElementExists(elem2.name);

                const exists = gameState.elements.find(e => e.name === combination.result);

                if (!exists) {
                    const newElement = {
                        name: combination.result,
                        icon: combination.icon,
                        discovered: true,
                        new: true
                    };
                    gameState.elements.push(newElement);
                    gameState.combinationsCount++;

                    showDiscoveryModal(newElement, combination.narration);
                    checkAchievements();
                    checkEraProgression();
                } else {
                    showAlreadyDiscoveredModal(combination.result);
                }
            } else {
                showNoResultModal();
            }

            gameState.selectedElements = [];
            updateCombineZone();
            renderElements();
            updateStats();

            // Re-enable after a short delay
            setTimeout(() => {
                updateCombineZone();
            }, 300);
        }

        function checkAchievements() {
            for (const [key, achievement] of Object.entries(ACHIEVEMENTS)) {
                if (!gameState.achievements.includes(key) && achievement.check(gameState)) {
                    gameState.achievements.push(key);
                    showAchievementNotification(achievement.name, achievement.desc);
                }
            }
            updateStats();
        }

        function showAchievementNotification(name, desc) {
            const notif = document.createElement('div');
            notif.className = 'achievement-notification';
            notif.innerHTML = `
                <div class="font-bold">${name}</div>
                <div class="text-xs">${desc}</div>
            `;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        function showAchievementsModal() {
            const unlockedCount = gameState.achievements.length;
            const totalCount = Object.keys(ACHIEVEMENTS).length;

            const achievementsList = Object.entries(ACHIEVEMENTS).map(([key, ach]) => {
                const unlocked = gameState.achievements.includes(key);
                return `
                    <div class="bg-white bg-opacity-${unlocked ? '10' : '5'} rounded-lg p-3 mb-2 ${unlocked ? '' : 'opacity-50'} text-left">
                        <div class="font-bold text-sm ${unlocked ? 'text-yellow-400' : 'text-gray-500'}">${unlocked ? ach.name : '🔒 ???'}</div>
                        <div class="text-xs ${unlocked ? 'text-gray-300' : 'text-gray-600'}">${unlocked ? ach.desc : 'Succès verrouillé'}</div>
                    </div>
                `;
            }).join('');

            const modal = document.createElement('div');
            modal.className = 'discovery-modal';
            modal.innerHTML = `
                <div class="discovery-content">
                    <div class="text-5xl mb-4">🏆</div>
                    <h2 class="text-2xl font-bold mb-4 text-yellow-400">Succès</h2>
                    <p class="text-base mb-4">${unlockedCount} / ${totalCount} débloqués</p>
                    <div class="max-h-96 overflow-y-auto">
                        ${achievementsList}
                    </div>
                    <button onclick="this.closest('.discovery-modal').remove()" class="btn-combine mt-4">
                        Fermer
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showDiscoveryModal(element, narration) {
            const modal = document.createElement('div');
            modal.className = 'discovery-modal';
            modal.innerHTML = `
                <div class="discovery-content">
                    <div class="text-6xl mb-4">${element.icon}</div>
                    <h2 class="text-2xl font-bold mb-3 text-yellow-400">Nouvelle découverte !</h2>
                    <h3 class="text-xl font-bold mb-4">${element.name}</h3>
                    <div class="narration-box text-left">
                        ${narration}
                    </div>
                    <button onclick="this.closest('.discovery-modal').remove()" class="btn-combine mt-4">
                        Continuer
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showAlreadyDiscoveredModal(elementName) {
            const modal = document.createElement('div');
            modal.className = 'discovery-modal';
            modal.innerHTML = `
                <div class="discovery-content">
                    <div class="text-5xl mb-4">🔄</div>
                    <h2 class="text-xl font-bold mb-3 text-gray-400">Déjà découvert</h2>
                    <p class="text-base mb-4">Tu as déjà <span class="text-yellow-400 font-bold">${elementName}</span></p>
                    <button onclick="this.closest('.discovery-modal').remove()" class="mobile-btn w-full">
                        D'accord
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showNoResultModal() {
            const modal = document.createElement('div');
            modal.className = 'discovery-modal';
            modal.innerHTML = `
                <div class="discovery-content">
                    <div class="text-5xl mb-4">❌</div>
                    <h2 class="text-xl font-bold mb-3 text-red-400">Aucun résultat</h2>
                    <p class="text-base mb-4">Cette combinaison ne mène à rien...</p>
                    <button onclick="this.closest('.discovery-modal').remove()" class="mobile-btn w-full">
                        Réessayer
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showHint() {
            const discoveredNames = gameState.elements.filter(e => e.discovered).map(e => e.name);
            const possibleHints = [];

            for (const key in COMBINATIONS) {
                const [elem1, elem2] = key.split('+');
                const combo = COMBINATIONS[key];

                if (discoveredNames.includes(elem1) && discoveredNames.includes(elem2)) {
                    const alreadyDiscovered = gameState.elements.find(e => e.name === combo.result);
                    if (!alreadyDiscovered) {
                        possibleHints.push({ elem1, elem2 });
                    }
                }
            }

            if (possibleHints.length === 0) {
                const modal = document.createElement('div');
                modal.className = 'discovery-modal';
                modal.innerHTML = `
                    <div class="discovery-content">
                        <div class="text-5xl mb-4">🤔</div>
                        <h2 class="text-xl font-bold mb-3 text-yellow-400">Aucun indice</h2>
                        <p class="text-base mb-4">Tu as découvert toutes les combinaisons possibles !</p>
                        <button onclick="this.closest('.discovery-modal').remove()" class="btn-combine">
                            D'accord
                        </button>
                    </div>
                `;
                document.body.appendChild(modal);
                return;
            }

            const hint = possibleHints[Math.floor(Math.random() * possibleHints.length)];
            const elem1Icon = gameState.elements.find(e => e.name === hint.elem1)?.icon || "❓";
            const elem2Icon = gameState.elements.find(e => e.name === hint.elem2)?.icon || "❓";

            const modal = document.createElement('div');
            modal.className = 'discovery-modal';
            modal.innerHTML = `
                <div class="discovery-content">
                    <div class="text-5xl mb-4">💡</div>
                    <h2 class="text-xl font-bold mb-3 text-yellow-400">Indice</h2>
                    <p class="text-base mb-4">Essaye de combiner :</p>
                    <div class="flex justify-center items-center gap-3 my-4">
                        <span class="text-5xl">${elem1Icon}</span>
                        <span class="text-2xl">+</span>
                        <span class="text-5xl">${elem2Icon}</span>
                    </div>
                    <p class="text-sm text-gray-400 mb-4">${hint.elem1} + ${hint.elem2}</p>
                    <button onclick="this.closest('.discovery-modal').remove()" class="btn-combine">
                        Compris !
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function checkEraProgression() {
            const discoveredCount = gameState.elements.filter(e => e.discovered).length;
            const currentEraData = ERAS[gameState.currentEra];

            if (discoveredCount >= currentEraData.threshold && gameState.currentEra < 5) {
                gameState.currentEra++;
                showEraTransition();
            }
        }

        function showEraTransition() {
            const newEra = ERAS[gameState.currentEra];
            const overlay = document.createElement('div');
            overlay.className = 'era-transition';
            overlay.innerHTML = `
                <div class="text-center px-4">
                    <h2 class="text-4xl font-bold mb-4 text-white">ÈRE ${newEra.name}</h2>
                    <p class="text-lg text-white">Nouvelle ère débloquée !</p>
                </div>
            `;
            document.body.appendChild(overlay);

            setTimeout(() => {
                overlay.remove();
                updateStats();
            }, 3000);
        }

        function updateStats() {
            const discoveredCount = gameState.elements.filter(e => e.discovered).length;
            const currentEraData = ERAS[gameState.currentEra];
            const progress = Math.min(100, (discoveredCount / currentEraData.threshold) * 100);

            document.getElementById('currentEra').textContent = currentEraData.name;
            document.getElementById('elementsCount').textContent = discoveredCount;
            document.getElementById('progressBar').style.width = `${progress}%`;
            document.getElementById('achievementsCount').textContent = gameState.achievements.length;
        }

        // Event listeners
        document.getElementById('resetBtn').onclick = () => {
            gameState.selectedElements = [];
            updateCombineZone();
            renderElements();
        };

        document.getElementById('hintBtn').onclick = showHint;
        document.getElementById('achievementsBtn').onclick = showAchievementsModal;
        document.getElementById('combineBtn').onclick = combineElements;

        // Initialize
        init();

        // Prevent zoom on double-tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
